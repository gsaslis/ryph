[tools]
bun = "1.4.4"
# 26, not 24: the artifact sanitizer runs confined under `node --permission`, which needs 25 or
# later (packages/orchestrator/docs/artifacts.md); the images ship the same major.
node = "26"
# The Helm chart's tests render it (deploy/helm/chart_test.ts): the `chart` check installs this
# and fails without it.
helm = "4.3.0"
