{{- /*
One Secret per service, named after it, unless the service names an existingSecret. README.md,
"The Secret contract", lists every key. They are kept on uninstall by default
(`secrets.keepOnUninstall`): three of them hold the keys that seal what the deployment stores.
*/ -}}
{{- /*
The public placeholders are a laptop's, and so is devState: one without the other is a real
deployment about to boot on credentials anyone can read in the ryph repository.
*/ -}}
{{- if and .Values.secrets.allowDevSecrets (not .Values.devState.enabled) -}}
{{- fail "secrets.allowDevSecrets lets every service boot with the public placeholder secrets committed to the ryph repository, and is for a laptop cluster only: it is refused without devState.enabled" -}}
{{- end -}}
{{- $root := . -}}
{{- $services := list "controlPlane" "app" "historian" "memory" "chat" "web" "modelProxy" "mcpGateway" "forge" "automations" "egressProxy" -}}
{{- if .Values.previews.enabled }}{{ $services = append $services "previews" }}{{ end -}}
{{- if .Values.radicle.enabled }}{{ $services = append $services "radicle" }}{{ end -}}
{{- range $services }}
{{- if not (get $root.Values .).existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ryph.secretName" (list $root .) }}
  namespace: {{ include "ryph.secretNamespace" (list $root .) }}
  labels:
    {{- include "ryph.labels.plain" $root | nindent 4 }}
  {{- if $root.Values.secrets.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  {{- range $k, $v := (include "ryph.secretData" (list $root .) | fromJson) }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- if and .Values.github.enabled .Values.github.privateKey (not .Values.github.privateKeySecret) }}
---
# The GitHub App's private key, mounted into the forge as a file.
apiVersion: v1
kind: Secret
metadata:
  name: forge-github-app
  namespace: {{ include "ryph.ns.services" . }}
  labels:
    {{- include "ryph.labels.plain" . | nindent 4 }}
type: Opaque
data:
  github-app.pem: {{ .Values.github.privateKey | b64enc | quote }}
{{- end }}
{{- if and .Values.radicle.enabled .Values.radicle.key.private (not .Values.radicle.key.existingSecret) }}
---
# The deployment's Radicle identity. Storage can be re-fetched from the network; the key every
# patch was signed with cannot be remade, so it is kept on uninstall like the master keys.
apiVersion: v1
kind: Secret
metadata:
  name: radicle-key
  namespace: {{ include "ryph.ns.services" . }}
  labels:
    {{- include "ryph.labels.plain" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  radicle: {{ .Values.radicle.key.private | b64enc | quote }}
  radicle.pub: {{ .Values.radicle.key.public | b64enc | quote }}
{{- end }}
