{{- /*
The historian: the transcript firehose, on its own database. Runs write to it with their run token,
which it verifies against the control plane; the app reads it with a user bearer, which it verifies
against the control plane's JWKS.
*/ -}}
{{- $v := .Values.historian -}}
{{- $image := include "ryph.image" (list . .Values.images.historian) -}}
{{- $secret := include "ryph.secretName" (list . "historian") -}}
{{- $env := include "ryph.historian.env" . | fromYamlArray -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: historian
  namespace: {{ include "ryph.ns.services" . }}
  labels:
    {{- include "ryph.labels" (list . "historian") | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: historian
  template:
    metadata:
      labels:
        {{- include "ryph.podLabels" "historian" | nindent 8 }}
      {{- with (include "ryph.podAnnotations" (list . $v (include "ryph.secretChecksum" (list . "historian"))) | trim) }}{{ . | nindent 6 }}{{ end }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 35
      {{- with (include "ryph.imagePullSecrets" . | trim) }}{{ . | nindent 6 }}{{ end }}
      {{- with (include "ryph.scheduling" (list . $v) | trim) }}{{ . | nindent 6 }}{{ end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1994
        runAsGroup: 1994
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # /tmp, the one place the read-only root lets the runtime write.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.migrations.enabled }}
        {{- include "ryph.migrate.volume" . | nindent 8 }}
      initContainers:
        {{- include "ryph.migrate.init" (dict "root" . "image" $image "name" "migrate" "workingDir" "/app/packages/historian" "variable" "RYPH_HISTORY_DB" "owner" "historian" "secret" $secret "key" "RYPH_HISTORY_DB") | nindent 8 }}
        {{- end }}
      containers:
        - name: historian
          image: {{ $image }}
          {{- with .Values.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          ports:
            - name: http
              containerPort: 7413
          env:
            {{- include "ryph.env" (list $env $v.extraEnv) | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ $secret }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: historian
  namespace: {{ include "ryph.ns.services" . }}
  labels:
    {{- include "ryph.labels" (list . "historian") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: historian
  ports:
    - name: http
      port: 7413
      targetPort: http

{{- define "ryph.historian.env" -}}
- name: RYPH_HISTORY_PORT
  value: "7413"
- name: RYPH_LOG_FORMAT
  value: json
- name: RYPH_PRE_STOP_MS
  value: "5000"
- name: RYPH_ORCHESTRATOR_URL
  value: {{ include "ryph.url" (list . "control-plane" "services" 7411) }}
- name: RYPH_AUTH_URL
  value: {{ include "ryph.url" (list . "control-plane" "services" 7411) }}
{{- include "ryph.db.secretEnv" (list . "historian" "RYPH_HISTORY_DB") }}
{{- end -}}
